name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Bash syntax check
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            echo "Checking $script"
            bash -n "$script"
          done < <(find src/unix install/unix -type f -name '*.sh' -print0)

  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Compile Unix test helper
        run: python -m py_compile tests/Audit/unix/test_config_unix.py

  # Full test_config_unix.py needs a live Tomcat install (lab only).
  # These unit tests cover XML helpers without mutating a Tomcat tree.
  unix-helper-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Run self-contained XML helper unit tests
        run: python -m unittest discover -s tests/unit -v

  powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          $parser = [System.Management.Automation.Language.Parser]
          $failures = @()
          Get-ChildItem -Path . -Recurse -File -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            $null = $parser::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $messages = ($errors | ForEach-Object { $_.Message }) -join '; '
              $failures += "$($_.FullName): $messages"
            }
          }
          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host 'All PowerShell scripts parsed successfully.'
